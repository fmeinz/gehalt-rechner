server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security Headers (OWASP) ───────────────────────────────────────────────
    # A05: Security Misconfiguration – verhindert Clickjacking
    add_header X-Frame-Options "DENY" always;
    # Verhindert MIME-Sniffing
    add_header X-Content-Type-Options "nosniff" always;
    # Schränkt Referrer-Informationen ein
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Deaktiviert Browser-Features, die die App nicht braucht
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Content Security Policy: nur eigene Ressourcen erlaubt
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none';" always;
    # Unterdrückt nginx-Versionsnummer in Fehlerseiten
    server_tokens off;

    # ── SPA-Routing ────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Statische Assets mit langem Cache ─────────────────────────────────────
    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Gzip-Komprimierung ─────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
